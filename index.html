<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Invoice</title>

    <!--
      Barlow and Barlow Condensed, the Industry typefaces. Linked rather than
      @imported from CSS so the connection can be warmed in parallel.

      These are CDN-hosted, which the offline requirement will outgrow: the faces
      need self-hosting to be precached, and the same files feed pdfmake's font
      vfs. One task, two consumers.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap"
    />

    <script>
      // Applied before first paint so a dark-theme user never sees a light flash.
      try {
        var stored = localStorage.getItem('invoice.theme')
        document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
